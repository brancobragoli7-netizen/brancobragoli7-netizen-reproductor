name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Musica.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Musica-apk
          path: Musica.apk

      # Publica el APK en la sección "Releases" para bajarlo directo desde el celular
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Música v1.0.${{ github.run_number }}
          body: Descargá Musica.apk e instalalo en Android.
          files: Musica.apk
          make_latest: true
